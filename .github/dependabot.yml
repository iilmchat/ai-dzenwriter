version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript остаётся на линейке 5.x, см. ADR-0001.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Типы Node совпадают с рантаймом из .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Новая версия Node переходит только по решению, см. .nvmrc и Dockerfile.
      - dependency-name: node
        update-types: ['version-update:semver-major']
