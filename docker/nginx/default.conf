# Один origin для браузера: статика web и проксирование API. CORS не нужен.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # CSP для всех ответов: инлайн-скриптов и стилей в билде нет, всё отдаётся
    # файлами /assets/... и /fonts/..., поэтому строгих директив достаточно.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # Генерация идёт долго: поток SSE не должен обрываться по таймауту.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:4000;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /ready {
        proxy_pass http://api:4000;
        proxy_set_header X-Request-Id $request_id;
    }

    location /assets/ {
        # nginx наследует add_header только в location без своих add_header:
        # заголовок Cache-Control отменяет серверный уровень, поэтому nosniff повторяем.
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
