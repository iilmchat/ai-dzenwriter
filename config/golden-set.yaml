        text: '[демо] За год доля российских компаний с ИИ-ассистентами в рабочих процессах выросла вдвое, сообщается в отчёте о цифровизации, опубликованном в сентябре 2026 года.'
        sourceUrl: 'https://example.com/ru-ai-adoption'
