  # Личный опыт пользователя ИИ-систем: политика experience_only — заметки опыта с согласием.
  # Гейт стиля требует 800+ знаков заметок опыта (min_note_chars), поэтому тексты длинные.
  - id: exp-01
    styleId: personal-experience
    format: article
    tone: engaging
    lengthMin: 4000
    lengthMax: 6000
    topic: 'Как я внедрил ИИ-ассистента в работу бухгалтерии'
    keywords: ['ИИ', 'бухгалтерия', 'опыт']
    facts:
      - type: experience_note
        text: '[демо] Записал опыт коллеги из бухгалтерии: она три месяца проверяла отчёты вместе с ИИ-ассистентом. Сначала отнеслась скептически: не доверяла машине цифры. Начали со сверки мелких таблиц — ассистент сводил выгрузки и подсвечивал расхождения, человек перепроверял спорные строки. К третьему месяцу рутинные сверка и сводка полностью ушли ассистенту, а спорные строки остались за человеком: он знает, где поставщик путает артикулы и где кассовый разрез может расходиться с бухгалтерским. Главный вывод коллеги: ассистент не принимает решения, а готовит основу для решения; после того как распределили роли, количество ошибок в отчётности не выросло, а время на закрытие месяца сократилось почти вдвое. Она отдельно подчёркивает: без знания предметной области ассистент бесполезен — он не знает, что спорно, а что нет.'
    mustNotContain: ['сенсация']

  - id: exp-02
    styleId: personal-experience
    format: article
    tone: expert-conversational
    lengthMin: 4000
    lengthMax: 6000
    topic: 'Мой месяц с ИИ-редактором: что изменилось в работе'
    keywords: ['ИИ', 'редактор', 'опыт']
    facts:
      - type: experience_note
        text: '[демо] Расскажу про свой месяц с ИИ-редактором: раньше первая версия текста занимала вечер, теперь черновик приходит за час. Но изменилось не только время. Изменился характер работы: я стал меньше писать и больше редактировать. ИИ-редактор собирает черновик из фактов, которые я дал, и каждую цифру тянет из моего списка. Если я дал мало фактов, он честно возвращает вопросы — просит источник или уточнение, вместо того чтобы выдумывать. Первые дни я злился на эти вопросы, потом понял: это не тормоз, а страховка. За месяц у меня не случилось ни одной публикации с выдуманным числом — то, о чём раньше я узнавал от читателей в комментариях. Лишние слова и штампы редактор тоже убирает, хотя с юмором справляется хуже меня: метафоры получаются гладкие, но безликие. Вывод за месяц: время уходит не на набор текста, а на точность формулировок — и это правильный обмен.'
    mustNotContain: ['надо отметить']

  - id: exp-03
    styleId: personal-experience
    format: article
    tone: engaging
    lengthMin: 4000
    lengthMax: 6000
    topic: 'Как я перестал бояться черновика на 6000 знаков'
    keywords: ['черновик', 'опыт']
    facts:
      - type: experience_note
        text: '[демо] Я колоннист, и много лет я боялся больших форматов: четырёх тысяч знаков кажется бесконечностью, когда тема не разложена по пунктам. Неделю назад я попробовал другой порядок: диктую мысли без структуры, а черновик собирает ИИ. Он раскладывает мои огрызки мыслей на вступление, основную часть и вывод, а я правлю структуру. Страх пустого листа сменился правкой структуры: это несравнимо легче. Первые два дня меня бесило, что модель вставляет общие фразы про «динамичный мир технологий», я вычёркивал их руками. На третий день я стал давать ему запреты прямо в брифе — и общие фразы исчезли. Теперь я вижу разницу: пустой лист требует изобретать структуру, а правка черновика требует решать, что лишнее. Второе я умею. На неделе я написал два материала по четыре тысячи знаков, и оба заняли меньше времени, чем раньше занимал один.'
    mustNotContain: ['шок']

  - id: exp-04
    styleId: personal-experience
    format: article
    tone: expert-conversational
    lengthMin: 4000
    lengthMax: 6000
    topic: 'ИИ-суммаризация совещаний: мой опыт трёх недель'
    keywords: ['ИИ', 'совещания', 'опыт']
    facts:
      - type: experience_note
        text: '[демо] Три недели я проверял ИИ-конспекты наших совещаний. Как это работает: запись расшифровывается, конспект собирает решения и список задач, а я утром пробегаю его и правлю. Итоги за три недели такие. Решения фиксируются точнее, чем в моих бумажных заметках: модель не стесняется написать «решили отложить» и указывает, кто возьмёт задачу. С числами и датами она тоже аккуратна: дедлайны и суммы из расшифровки переносит верно. Но с людьми путается: два раза перепутала, кто именно возглавил рабочую группу, один раз приписала инициативу тому, кто просто громко согласился. Теперь имена перепроверяю в первую очередь. Ещё нюанс: если совещание хаотичное, конспект получается вежливо-водянистый — модель сглаживает конфликт, а конфликт как раз важен. Мой вывод: конспекты беру как черновик протокола, а финальную редактуру делает человек, который был в комнате.'
    mustNotContain: ['уникальный шанс']

  - id: exp-05
    styleId: personal-experience
    format: article
    tone: engaging
    lengthMin: 4000
    lengthMax: 6000
    topic: 'Что я понял, проверяя факты в тексте с ИИ'
    keywords: ['факты', 'проверка', 'опыт']
    facts:
      - type: experience_note
        text: '[демо] Неделю я занимался странным делом: проверял ИИ-тексты по фактам, как дотошный корректор. Брал готовый материал, открывал источники и сверял каждое утверждение. Результат меня удивил. Числа и даты совпадали почти всегда: если модель писала «на 34%», то в источнике было 34%. Провалы случались в другом месте: в контексте. Модель уверенно писала, что «исследование показало», когда исследование лишь предполагало; она склеивала два независимых факта в одну причинно-следственную связь, которой в источнике не было. Один раз так появился заголовок с обещанием, которого в тексте не было. Я записал правило: цифрам верю после проверки единицы на десять, а формулировкам про «показало» и «доказало» — не верю до последнего. Проверка не стала быстрее, зато стала целенаправленной: я знаю, где искать провал.'
    mustNotContain: ['и так далее', 'надо отметить']

