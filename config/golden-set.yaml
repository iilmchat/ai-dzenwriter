        productId: '00000000-0000-4000-8000-0000000000e1'
      - type: product_fact
        text: '[демо] Экран пилота показывает средние по каждому критерию рубрики.'
        productId: '00000000-0000-4000-8000-0000000000e1'
    mustNotContain: ['надо отметить']
