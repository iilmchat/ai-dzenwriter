        text: '[демо] Отметка публикации со ссылкой на статью видна на экране публикаций.'
        productId: '00000000-0000-4000-8000-0000000000e1'
    mustNotContain: ['уникальный шанс']

  - id: prod-05
    styleId: product-description
    format: article
    tone: expert-conversational
    lengthMin: 3000
    lengthMax: 5000
    topic: 'Рубрика редактора: как оценивается качество текста'
