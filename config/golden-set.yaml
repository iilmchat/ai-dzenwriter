# Golden set для пилота качества генерации (docs/00-design, раздел 7.4).
# 20 брифов, по пять на каждый стиль, с ожидаемыми фактами и запретами.
# Факты помечены [демо] — владелец заменяет их на реальные через PR.
# Правила изменения: сет согласуется с владельцем; каждый бриф — в фокусе ИИ (дизайн, 3.2).
briefs:
