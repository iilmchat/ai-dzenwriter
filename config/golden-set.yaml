    keywords: ['ИИ', 'регулирование', 'маркировка']
    facts:
      - type: news_source
        text: '[демо] Регуляторы ЕС утвердили требования к маркировке ИИ-контента в октябре 2026 года; исключение — материалы, созданные полностью человеком, при условии подтверждения.'
        sourceUrl: 'https://example.com/eu-ai-labels'
        sourcePublishedAt: '2026-10-20'
    mustNotContain: ['сенсация', 'шок', 'срочно']

  - id: news-02
