# Форматы материала. Формат задаёт каркас, объём и число блоков; стиль задаёт голос и политику фактов.
# Объём считается в знаках с пробелами. Значения для лонгрида, подборки и кейса — предложение, подтвердить.
unit: chars_with_spaces
default_length:
  min: 6000
  max: 8000
formats:
  news:
    name: "Новость"
    length: {min: 4000, max: 6000}
    blocks: {min: 2, max: 3}
    structure: "лид (что, кто, когда) → контекст → технические детали → что проверить"
  article:
    name: "Статья"
    length: {min: 8000, max: 12000}
    blocks: {min: 3, max: 5}
    structure: "вступление с болью → блоки «проблема → решение → пример» → вывод"
  longread:
    name: "Лонгрид"
    length: {min: 12000, max: 20000}
    blocks: {min: 5, max: 7}
    structure: "крючок-вступление → главы с подзаголовками → итоги и открытые вопросы"
  roundup:
    name: "Подборка"
    length: {min: 6000, max: 10000}
    items: {min: 5, max: 10}
    structure: "короткое вступление → пронумерованные пункты H2 по 2–4 предложения → вывод"
  case:
    name: "Кейс"
    length: {min: 8000, max: 12000}
    blocks: {min: 4, max: 5}
    structure: "контекст → задача → что сделали → результат (только из фактов) → ограничения и выводы"
