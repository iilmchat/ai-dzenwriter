# Правила общих проверок текста: штампы, кликбейт, запреты, слова-маркеры.
# Эти списки — источник истины для движка проверок. Базовый промпт
# prompts/dzen_writer.md перечисляет те же штампы: тест сверяет, что списки не разошлись.
# Изменения — через PR с ревью руководителя контента.

# Штампы из промпта: не звучат как живой текст.
banned_phrases:
  - 'в современном мире'
  - 'важно отметить'
  - 'стоит подчеркнуть'
  - 'давайте разберёмся'
  - 'не секрет, что'
  - 'открывает новые горизонты'
  - 'в эпоху цифровых технологий'

# Приёмы, которые обещают больше, чем дают факты.
clickbait_phrases:
  - 'шок'
  - 'сенсация'
  - 'срочно'
  - 'вы не поверите'

# Обещания, которые нельзя делать без подтверждающего факта.
forbidden_guarantees:
  - 'гарантируем'
  - 'гарантия'
  - 'без риска'
  - 'полностью безопасно'
  - 'не может ошибиться'
  - 'стопроцентно'

# Превосходные степени: требуют подтверждающего факта.
superlative_words:
  - 'лучший'
  - 'лучшая'
  - 'лучшее'
  - 'лучшие'
  - 'самый'
  - 'самая'
  - 'самое'
  - 'самые'
  - 'уникальный'
  - 'уникальная'
  - 'уникальное'
  - 'уникальные'
  - 'единственный'
  - 'единственная'
  - '№1'
  - 'первое место'

# Слова с заглавной буквы, которые именами не являются. Сравнение без учёта регистра.
